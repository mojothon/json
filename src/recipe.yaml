# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: "0.2.1"

package:
  name: "json"
  version: 0.2.1

source:
  - path: .
  - path: ../LICENSE
  - path: ../tests
  # work 目录需要 pixi.toml,build 阶段的 `pixi run mojo precompile json`
  # 才能找到 manifest(与 nova recipe 的 source 配置保持一致)。
  - path: ../pixi.toml

build:
  script:
    - mkdir -p ${PREFIX}/lib/mojo
    # darwin 用替身包替换 json/gpu:json/gpu 是 CUDA-only(import max.gpu,
    # mac 的 max 包不含 gpu 模块,'unable to locate module gpu'——2026-11-05
    # macos-14 探针 C4 第 6 轮实录);而核心 parser 顶层急切导入 .gpu,且
    # Mojo 对文本 import 的解析与 comptime 可达性无关(第 8 轮实录:comptime
    # if 死分支里的 import 照样解析)——所以唯一干净的结构是构建期换包:
    # 替身签名与真包一致(json_gpu_stub/,checked-in,在 json/ 包外不参与
    # linux 预编译),调用即明确报错。改真包 gpu 签名时必须同步改替身。
    - if [ "$(uname -s)" = "Darwin" ]; then rm -rf json/gpu && cp -r json_gpu_stub json/gpu; fi
    # 直接调 PATH 中的 mojo,不要 `pixi run`:work 目录里的 pixi.toml 平台是
    # linux-64,mac 构建时 pixi 直接拒跑("supported platforms are linux-64"
    # —— 2026-11-05 macos-14 探针 C4 实测抓到)。nova recipe 同款修法;
    # MODULAR_HOME 由 mojo 二进制路径上推两级到 env 根再拼 share/max。
    - MODULAR_HOME=$(dirname $(dirname $(command -v mojo)))/share/max mojo precompile json
    - cp json.mojoc ${PREFIX}/lib/mojo/json.mojoc
requirements:
  build:
    # 构建自包含:precompile 需要 mojo(编译器)与 max(json.gpu eager import
    # 的 max.gpu.primitives 经 lib/mojo/max.mojoc 解析——dev env 里 std.mojoc
    # 与 max.mojoc 同在 $ENV/lib/mojo)。2026-11-05 macos-14 探针两轮实测:
    # 没有 build reqs 时第一层卡 pixi 平台、第二层卡 max 解析。
    # 版本与 run 段保持一致:mojoc 与编译器版本绑定,构建/运行 pin 必须同源。
    - mojo >= 1.2.0,<2
    - max >= 26.7.0,<27
  run:
    # 上限 <2 排除 Modular 25.x 老 dev 版(25 > 1 会被 conda 排序优先选中,
    # 导致测试环境拿到 25.6.0.dev* 而非 1.0.0 final,语法/模块解析均不兼容)。
    - mojo >= 1.2.0,<2
    # json.gpu 模块引用 max.gpu,json.mojoc 惰性引用,运行时需可解析 max。
    - max >= 26.7.0,<27

tests:
  - script:
      # Lightweight publish gate: build + run a smoke test against the
      # packaged json.mojoc.  No pixi env / no tests/ dir copy needed.
      - mojo build -o /tmp/json_smoke -I ${PREFIX}/lib/mojo smoke_test.mojo
      - /tmp/json_smoke

    files:
      # Extra files to be copied to the test directory from the "work directory"
      source:
        - smoke_test.mojo

about:
  homepage: https://github.com/mojothon/json
  license: MIT
  license_file: LICENSE
  summary: a json package using mojo programming language.. https://github.com/mojothon/json
  repository: https://github.com/mojothon/json
